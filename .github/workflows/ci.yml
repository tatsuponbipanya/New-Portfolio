name: CI

# mainブランチにPushされたときと、Pull Requestが作られたときに自動で動く設定
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 自分のコードをGitHubのサーバーに持ってくる
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Rubyの環境をセットアップする
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.10
          bundler-cache: true # ジェムのインストールを速くする

      # 3. データベース（SQLite）の準備
      - name: Set up database
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      # 4. RuboCopでコードが綺麗かチェック
      - name: Run RuboCop
        run: bundle exec rubocop

      # 5. RSpecでテストを実行
      - name: Run RSpec
        run: bundle exec rspec
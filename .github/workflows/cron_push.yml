name: Daily Push Notification Cron

on:
  schedule:
    # 毎日、日本時間の「13:24」に自動実行する設定
    # GitHubは世界標準時（UTC）なので、13時から9時間引いた「4:24」を指定
    - cron: '24 4 * * *'
    # 手動実行ボタン
  workflow_dispatch:

jobs:
  trigger_push:
    runs-on: ubuntu-latest
    steps:
      - name: Call Rails Push Endpoint
        run: |
          curl -X POST https://new-portfolio-eqo4.onrender.com/api/cron_tasks/send_daily \
            -H "Authorization: Bearer ${{ secrets.CRON_TOKEN }}"